name: build-interactive-fatjar

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # 1️⃣  Checkout
    - uses: actions/checkout@v4
      with: { fetch-depth: 0 }

    # 2️⃣  JDK 17  (Tycho 2.7+ understands Java 17)
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    # 3️⃣  Maven cache
    - uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key:  ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

    # 4️⃣  Build shaded jar for **interactive** module only
    #     • -P product —> turns off the Eclipse-plugin packaging and
    #                     activates the "standalone" packaging defined by SST
    #     • -D tycho.executionEnvironment=JavaSE-17
    #     • -pl org.omg.sysml.interactive -am  (makes upstream deps first)
    - name: Build interactive fat-jar
      run: |
        ./mvnw -B \
          -Pproduct \
          -Dtycho.executionEnvironment=JavaSE-17 \
          -DskipTests \
          -pl org.omg.sysml.interactive -am \
          package

    # 5️⃣  Upload the jar
    - uses: actions/upload-artifact@v4
      with:
        name: sysml-services-jar
        path: org.omg.sysml.interactive/target/org.omg.sysml.interactive*-all.jar
