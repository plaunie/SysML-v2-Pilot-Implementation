name: build-pilot-interactive

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # ─── 1 ▸ Checkout ───────────────────────────────────────
    - uses: actions/checkout@v4
      with: { fetch-depth: 0 }

    # ─── 2 ▸ JDK 21  (to match the EE in the POMs) ─────────
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    # ─── 3 ▸ Cache Maven repo ───────────────────────────────
    - uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key:  ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

    # ─── 4 ▸ Build shaded JAR  ──────────────────────────────
    #        -Pstandalone comes from sysml-pilot POM; it triggers the
    #        maven-shade-plugin for org.omg.sysml.interactive
    #        Tycho 3.x is injected via .mvn/extensions.xml
    - name: Build interactive shaded jar
      run: |
        # Tycho 3 so it knows JavaSE-21
        mkdir -p .mvn
        cat <<'XML' > .mvn/extensions.xml
        <extensions>
          <extension>
            <groupId>org.eclipse.tycho</groupId>
            <artifactId>tycho-maven-plugin</artifactId>
            <version>3.0.4</version>
          </extension>
        </extensions>
        XML

        ./mvnw -B \
          -Pstandalone -DskipTests \
          -pl org.omg.sysml.interactive -am \
          package

    # ─── 5 ▸ Upload artefact ────────────────────────────────
    - uses: actions/upload-artifact@v4
      with:
        name: sysml-interactive-fatjar
        path: org.omg.sysml.interactive/target/org.omg.sysml.interactive*-all.jar
