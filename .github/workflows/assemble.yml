name: build-fat-jar

on:
  workflow_dispatch:          # manual run
  push:
    branches: [ main ]
  schedule:                   # nightly build (optional)
    - cron: "0 2 * * *"

jobs:
  assembly:
    runs-on: ubuntu-latest      # or self-hosted Linux runner inside corporate LAN
    timeout-minutes: 30

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    # ---------- BUILD -------------
    - name: Cache ~/.ivy2 + ~/.sbt     # speeds up repeat builds
      uses: actions/cache@v3
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
        key:  ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}

    - name: Assemble fat-jar
      run: |
        sbt +assembly
      # Jar lands in target/scala-*/org.omg.sysml.interactive-<ver>-all.jar

    # ---------- PUBLISH -----------
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sysml-fat-jar
        path: |
          **/target/scala*/org.omg.sysml.interactive*-all.jar
        if-no-files-found: error

    # (optional) Push to GitHub Packages Maven registry
    - name: Publish to GitHub Packages
      if: ${{ github.event_name != 'pull_request' }}   # don’t publish on PRs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mvn --batch-mode \
            deploy:deploy-file \
            -DgroupId=org.omg.sysml \
            -DartifactId=sysml-api-services \
            -Dversion=${{ github.run_number }} \
            -Dpackaging=jar \
            -Dfile=$(find . -name '*-all.jar' | head -n1) \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/${{ github.repository }}
