name: build-fat-jar (pilot-impl)

on:
  workflow_dispatch:           # manual trigger
  push:
    branches: [ main ]         # build on every merge to main

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    # ── 1 ▸ Checkout  ─────────────────────────────────────────────
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ── 2 ▸ JDK 17 (build + run)  ────────────────────────────────
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    # ── 3 ▸ Cache Maven deps  ────────────────────────────────────
    - name: Cache Maven repo
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key:  ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

    # ── 4 ▸ Build ONLY the “interactive” module  ─────────────────
    #        -P fat-jar profile makes an all-deps shaded jar
    - name: Build interactive fat-jar
      run: |
        ./mvnw -B -pl org.omg.sysml.interactive -am \
               -Pfat-jar,skip-tests \
               verify

    # ── 5 ▸ Upload the jar as CI artifact  ───────────────────────
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sysml-services-jar
        path: org.omg.sysml.interactive/target/org.omg.sysml.interactive*-all.jar
