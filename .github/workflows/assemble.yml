name: build-fat-jar

# ──────────────── TRIGGERS ────────────────
on:
  workflow_dispatch:           # manual “Run workflow”
  push:
    branches: [ main ]         # every merge to main branch
  schedule:
    - cron: "0 2 * * *"        # optional nightly build at 02:00 UTC

# ───────────────── JOB ────────────────────
jobs:
  assembly:
    runs-on: ubuntu-latest       # change to self-hosted if public runners not allowed
    timeout-minutes: 45

    steps:
    # 1) Checkout
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0           # pull tags → dynver can embed version in JAR name

    # 2) JDK 17
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    # 3) sbt launcher (tiny download, no root)
    - name: Install sbt 1.9
      run: |
        curl -sL https://github.com/sbt/sbt/releases/download/v1.9.9/sbt-1.9.9.tgz -o sbt.tgz
        tar -xzf sbt.tgz
        echo "$PWD/sbt/bin" >> $GITHUB_PATH

    # 4) Cache Ivy + sbt dirs
    - uses: actions/cache@v3
      with:
        path: |
          ~/.ivy2/cache
          ~/.sbt
        key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt') }}

    # 5) Assemble the REST-service fat-jar
    - name: sbt servicesJVM/assembly
      run: sbt "servicesJVM/assembly"

    # 6) Upload artifact
    - uses: actions/upload-artifact@v4
      with:
        name: sysml-services-jar
        path: |
          **/servicesJVM/target/scala*/org.*sysml*.jar
